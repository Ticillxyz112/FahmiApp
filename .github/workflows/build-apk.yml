name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Linux dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # 4. Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Verify Java
      - name: Verify Java
        run: |
          java -version
          javac -version

      # 6. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 7. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Accept licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # 9. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          sdkmanager --list_installed

          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

          if [ -x "$AIDL" ]; then
            echo "AIDL successfully installed"
          else
            echo "AIDL missing"
            exit 1
          fi

      # 10. Configure Buildozer SDK
      - name: Configure Buildozer SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$HOME/.buildozer/android/platform"

          if [ ! -e "$SDK" ]; then
            ln -s "$ANDROID_HOME" "$SDK"
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          echo "Buildozer SDK configured"

          "$SDK/tools/bin/sdkmanager" --version

      # 11. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer cython

      # 12. Verify Buildozer
      - name: Verify Buildozer
        run: |
          buildozer --version
          python --version
          cython --version

      # 13. Verify app configuration
      - name: Verify buildozer.spec
        run: |
          echo "===== BUILD CONFIGURATION ====="

          grep -E \
            'android.api|android.minapi|android.ndk|p4a.branch|p4a.source_dir|requirements' \
            buildozer.spec || true

      # 14. Download Python-for-Android
      - name: Install Python-for-Android
        run: |
          git clone \
            --depth 1 \
            --branch develop \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

      # 15. Verify Python-for-Android
      - name: Verify Python-for-Android
        run: |
          P4A="$GITHUB_WORKSPACE/python-for-android"

          if [ -d "$P4A" ]; then
            echo "Python-for-Android directory found"
          else
            echo "Python-for-Android missing"
            exit 1
          fi

          if [ -f "$P4A/setup.py" ]; then
            echo "setup.py found"
          else
            echo "setup.py missing"
            exit 1
          fi

          ls -la "$P4A"

      # 16. Build APK
      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          APP_P4A_SOURCE_DIR: ${{ github.workspace }}/python-for-android

      # 17. Verify APK
      - name: Verify APK
        run: |
          echo "===== APK FILES ====="
          ls -lh bin/

          APK=$(find bin -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not generated"
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK"

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FahmiApp-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
