
name: Build Fahmi Trading App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      APP_VERSION: "2.0.2"

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install Linux dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libsqlite3-dev \
            gettext \
            patch

      # 5. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 6. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 7. Accept Android licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # 8. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "===== ANDROID SDK ====="

          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          javac -version

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "Android SDK verified!"
      
      # 9. Configure Buildozer SDK
      - name: Configure Buildozer SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          # Connect Buildozer SDK to Android SDK
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_HOME" "$SDK"

          # Find the actual sdkmanager
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          # Create legacy path required by Buildozer
          mkdir -p "$SDK/tools/bin"

          ln -sfn "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          # Verify compatibility path
          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "Buildozer SDK configured successfully!"

      # 10. Install Buildozer and Cython
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.37" \
            "buildozer==1.6.0"

      # 11. Verify application files
      - name: Verify application files
        run: |
          echo "===== PROJECT FILES ====="

          ls -la

          test -f main.py
          test -f scanner_engine.py
          test -f buildozer.spec

          echo "===== PYTHON FILES ====="

          find . -maxdepth 2 -type f -name "*.py" -print

          echo "===== PYTHON SYNTAX ====="

          python -m py_compile main.py scanner_engine.py

          echo "Application files verified!"

      # 12. Verify Buildozer configuration
      - name: Verify buildozer.spec
        run: |
          echo "===== BUILD CONFIGURATION ====="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch)[[:space:]]*=' \
            buildozer.spec

          grep -q 'requests' buildozer.spec
          grep -q 'INTERNET' buildozer.spec

          grep -Eq \
            '^[[:space:]]*p4a.branch[[:space:]]*=[[:space:]]*develop[[:space:]]*$' \
            buildozer.spec

          echo "Build configuration verified!"

      # 13. Verify Buildozer
      - name: Verify Buildozer
        run: |
          python --version
          cython --version
          buildozer --version

      # 14. Build Android APK
      - name: Build Fahmi Trading App
        run: |
          buildozer -v android debug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 15. Verify APK
      - name: Verify APK
        run: |
          mkdir -p output

          APK=$(find bin -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          cp "$APK" "output/FahmiTradingApp-v${APP_VERSION}.apk"

          echo "===== APK GENERATED ====="
          ls -lh output/

      # 16. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FahmiTradingApp-v2.0.2
          path: output/FahmiTradingApp-v2.0.2.apk
          if-no-files-found: error
          retention-days: 7
