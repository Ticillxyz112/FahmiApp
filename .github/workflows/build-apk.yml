
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Linux dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # 4. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Verify Java
      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "$JAVA_HOME"

      # 6. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 7. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Accept Android licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # 9. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "Android SDK verified"

      # 10. Configure Buildozer SDK
      - name: Configure Buildozer SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$HOME/.buildozer/android/platform"

          if [ ! -e "$SDK" ]; then
            ln -s "$ANDROID_HOME" "$SDK"
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      # 11. Install Buildozer and compatible Cython
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.37" \
            "buildozer==1.6.0"

      # 12. Verify Buildozer
      - name: Verify Buildozer
        run: |
          python --version
          cython --version
          buildozer --version

      # 13. Verify buildozer.spec
      - name: Verify buildozer.spec
        run: |
          echo "===== BUILD CONFIGURATION ====="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch)[[:space:]]*=' \
            buildozer.spec

          grep -Eq \
            '^[[:space:]]*p4a.branch[[:space:]]*=[[:space:]]*develop[[:space:]]*$' \
            buildozer.spec

          echo "Python-for-Android branch: develop"

      # 14. Build APK
      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 15. Verify APK
      - name: Verify APK
        run: |
          echo "===== GENERATED APK ====="

          find bin -type f -name "*.apk" -print

          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FahmiApp-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
